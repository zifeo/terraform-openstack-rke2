name: cloud-init

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # installs mise.lock, checksums verified
      - uses: jdx/mise-action@v5.2.0

      - name: Render cloud-init and reject invalid YAML
        working-directory: tests/cloud-init
        run: |
          tofu init -backend=false -input=false
          tofu test

      - name: Manifests, cross-server identity, cloud-init schema, shellcheck, versions
        run: uv run pytest -q tests/static
