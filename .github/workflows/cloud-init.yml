name: cloud-init

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: opentofu/setup-opentofu@v1
        with:
          tofu_version: 1.9.1
          tofu_wrapper: false

      - name: Render cloud-init and reject invalid YAML
        working-directory: tests/cloud-init
        run: tofu test
