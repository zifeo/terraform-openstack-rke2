on:
  push:
    tags:
      - v*

permissions:
  contents: write
  discussions: write

jobs:
  release:
    runs-on: ubuntu-latest
    if: github.ref_type == 'tag'

    steps:
      - uses: actions/checkout@v7
      - uses: ncipollo/release-action@v1.21.0
        with:
          tag: ${{ github.ref_name }}
          makeLatest: true
          generateReleaseNotes: true
          discussionCategory: "Announcements"
