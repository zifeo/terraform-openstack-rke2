name: patches

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  patches:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # installs mise.lock, checksums verified
      - uses: jdx/mise-action@v5.2.0

      - name: Run patch tests
        run: uv run pytest -q tests/patches

      - name: Upload diff on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: snapshots-diff
          path: tests/patches/snapshots/
