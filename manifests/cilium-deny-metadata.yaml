# The instance metadata serves the node's user_data, which holds its SSH host key: pods do not reach it. Host-network
# pods are no Cilium endpoints: the node's nftables keep them off.
apiVersion: cilium.io/v2
kind: CiliumClusterwideNetworkPolicy
metadata:
  name: deny-instance-metadata
spec:
  endpointSelector: {}
  # a policy selecting every pod would otherwise put each one in default-deny
  enableDefaultDeny:
    egress: false
    ingress: false
  egressDeny:
    - toCIDR:
        - 169.254.169.254/32
